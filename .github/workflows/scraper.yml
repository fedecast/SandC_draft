name: scrape-sportsws

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape
        run: python scraper.py
        env:
          SPORTSWS_USER: ${{ secrets.SPORTSWS_USER }}
          SPORTSWS_PASS: ${{ secrets.SPORTSWS_PASS }}
          PLAYERS_URL: ${{ vars.PLAYERS_URL }}
          LOGIN_URL: ${{ vars.LOGIN_URL }}
          LEAGUE_URL: ${{ vars.LEAGUE_URL }}

      - name: Screenshot di debug se fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3

      - name: Commit se i dati sono cambiati
        run: |
          git config user.name "scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "FA update $(date -u +%FT%TZ)" && git push)
